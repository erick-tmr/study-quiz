<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Quiz</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efede6; --text: #1d1c1a; --muted: #6b675f;
  --border: #dedad0; --accent: #3b5bdb; --accent-ink: #ffffff;
  --ok: #2b8a3e; --ok-bg: #e6f4ea; --warn: #b35c00; --warn-bg: #fff1e0; --bad: #c92a2a; --bad-bg: #fdeaea;
  --radius: 14px; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 24px rgba(0,0,0,.06);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --surface: #1e1d1b; --surface-2: #2a2926; --text: #ecebe6; --muted: #9d998f;
    --border: #36342f; --accent: #7c95ff; --accent-ink: #0f1020;
    --ok: #69db7c; --ok-bg: #1d3323; --warn: #ffa94d; --warn-bg: #3a2a16; --bad: #ff8787; --bad-bg: #3b1f1f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
header.top a { color: var(--muted); text-decoration: none; font-size: 14px; }
header.top a:hover { color: var(--text); }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 18px; margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
.progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 0 0 16px; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }
.meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.prompt { font-size: 19px; font-weight: 600; line-height: 1.4; margin: 4px 0 18px; white-space: pre-wrap; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; width: 100%; font: inherit; color: inherit; background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; transition: border-color .15s, background .15s; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .k { font: 600 13px var(--mono); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; min-width: 24px; height: 24px;
  display: inline-flex; align-items: center; justify-content: center; flex: none; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
textarea { width: 100%; min-height: 150px; resize: vertical; font: inherit; color: inherit; background: var(--bg);
  border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; }
textarea:focus, .opt:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.spacer { flex: 1; }
button.btn { font: 600 15px var(--font); border-radius: 10px; padding: 10px 16px; cursor: pointer; border: 1.5px solid var(--border);
  background: var(--surface); color: var(--text); }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.btn:disabled { opacity: .55; cursor: default; }
.feedback { margin-top: 16px; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); }
.feedback.ok { background: var(--ok-bg); border-color: transparent; }
.feedback.partial { background: var(--warn-bg); border-color: transparent; }
.feedback.bad { background: var(--bad-bg); border-color: transparent; }
.feedback h3 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 10px; align-items: baseline; }
.score { font: 700 22px var(--mono); }
.feedback p { margin: 6px 0; }
.points { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 4px; font-size: 14px; }
.points li::before { content: attr(data-i); display: inline-block; width: 20px; font-weight: 700; }
.points li.hit::before { color: var(--ok); }
.points li.miss::before { color: var(--bad); }
details { margin-top: 8px; font-size: 14px; }
summary { cursor: pointer; color: var(--muted); }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; }
@keyframes spin { to { transform: rotate(360deg); } }
.list { display: grid; gap: 12px; }
.list a.card { display: block; color: inherit; text-decoration: none; padding: 16px 18px; }
.list a.card:hover { border-color: var(--accent); }
.list .t { font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0 18px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 12px; }
.stat b { display: block; font: 700 22px var(--mono); }
.review { display: grid; gap: 8px; margin-top: 8px; }
.review .item { display: flex; gap: 10px; align-items: baseline; font-size: 14px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; transform: translateY(-1px); }
.dot.ok { background: var(--ok); } .dot.partial { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.skip { background: var(--border); }
.err { color: var(--bad); }
.checks { display: grid; gap: 6px; margin: 8px 0; font-size: 14px; }
.checks label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.checks input { margin-top: 4px; accent-color: var(--accent); }
code { font-family: var(--mono); font-size: .92em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
kbd { font: 12px var(--mono); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
@media (max-width: 480px) { .card { padding: 16px; } .prompt { font-size: 17px; } .stats { grid-template-columns: 1fr 1fr 1fr; } }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script id="quiz-data" type="application/json">null</script>
<script>
"use strict";
// Standalone mode: the quiz is embedded by `sq.py build` (opened as a file, on GitHub
// Pages, etc.). Open answers are then self-checked; Claude grading needs the local server.
const EMBEDDED = JSON.parse(document.getElementById("quiz-data").textContent || "null");
const OFFLINE = !!EMBEDDED;
const SERVER_URL = "http://localhost:8765";
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// ------------------------------------------------------------------ index
async function renderIndex() {
  document.title = "Study Quiz";
  let data;
  try { data = await api("/api/quizzes"); } catch (e) { $app.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  const items = data.quizzes.map(q => `
    <a class="card" href="/quiz/${encodeURIComponent(q.slug)}">
      <div class="t">${esc(q.title)}</div>
      <div class="small muted">${q.mc} multiple choice · ${q.open} open · ${q.attempts} attempts${q.created ? " · " + esc(q.created) : ""}</div>
    </a>`).join("");
  $app.innerHTML = `
    <header class="top"><h1>Study Quiz${data.group ? ` <span class="tag">${esc(data.group)}</span>` : ""}</h1><span class="small muted">${esc(data.workspace)}</span></header>
    ${items ? `<div class="list">${items}</div>` :
      `<div class="card"><h2>No quizzes yet</h2><p class="muted">In Claude Code, run <code>/study-quiz:quiz &lt;topic or notes file&gt;</code> to generate one.</p></div>`}`;
}

// ------------------------------------------------------------------ quiz
const S = { quiz: null, order: [], i: 0, results: {} }; // results[qid] = {status: ok|partial|bad, ...}

async function renderQuizPage(slug) {
  try { S.quiz = await api(`/api/quiz/${encodeURIComponent(slug)}`); }
  catch (e) { $app.innerHTML = `<p class="err">${esc(e.message)}</p><p><a href="/">← all quizzes</a></p>`; return; }
  document.title = `${S.quiz.title} · Study Quiz`;
  start(S.quiz.questions);
}

function start(questions) {
  S.order = shuffle(questions);
  S.i = 0;
  S.results = {};
  renderCard();
}

function shell(inner) {
  const n = S.order.length, pct = n ? (S.i / n) * 100 : 0;
  $app.innerHTML = `
    <header class="top"><h1>${esc(S.quiz.title)}</h1>${OFFLINE ? "" : `<a href="/">All quizzes</a>`}</header>
    <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div>
    ${inner}`;
}

function renderCard() {
  if (S.i >= S.order.length) return renderSummary();
  const q = S.order[S.i];
  const head = `<div class="meta"><span>Question ${S.i + 1} of ${S.order.length}</span>
    <span class="tag">${q.type === "mc" ? "Multiple choice" : "Open-ended"}${q.difficulty ? " · " + esc(q.difficulty) : ""}</span></div>
    <div class="prompt">${esc(q.prompt)}</div>`;
  if (q.type === "mc") {
    const opts = q.options.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${"ABCDEFGH"[k]}</span><span>${esc(o)}</span></button>`).join("");
    shell(`<section class="card">${head}<div class="opts">${opts}</div><div id="fb"></div>
      <div class="row"><span class="small muted">Keys <kbd>1</kbd>–<kbd>${q.options.length}</kbd></span><span class="spacer"></span>
      <button class="btn primary" id="next" hidden>Next →</button></div></section>`);
    $app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => answerMC(q, +b.dataset.k)));
  } else {
    shell(`<section class="card">${head}
      <textarea id="ans" placeholder="Write your answer in your own words…"></textarea>
      <div id="fb"></div>
      <div class="row"><span class="small muted" id="hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> to submit</span><span class="spacer"></span>
        <button class="btn" id="skip">Skip</button>
        <button class="btn primary" id="grade">${OFFLINE ? "Check my answer" : "Grade with Claude"}</button>
        <button class="btn primary" id="next" hidden>Next →</button></div></section>`);
    const ta = document.getElementById("ans");
    ta.focus();
    ta.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); answerOpen(q); } });
    document.getElementById("grade").addEventListener("click", () => answerOpen(q));
    document.getElementById("skip").addEventListener("click", () => { S.results[q.id] = { status: "skip" }; next(); });
  }
  document.getElementById("next").addEventListener("click", next);
}

function next() { S.i++; renderCard(); window.scrollTo({ top: 0 }); }

function answerMC(q, k) {
  if (S.results[q.id]) return;
  const correct = k === q.answer;
  S.results[q.id] = { status: correct ? "ok" : "bad" };
  $app.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    const j = +b.dataset.k;
    if (j === q.answer) b.classList.add("right");
    else if (j === k) b.classList.add("wrong");
  });
  document.getElementById("fb").innerHTML = `<div class="feedback ${correct ? "ok" : "bad"}">
    <h3>${correct ? "Correct" : "Not quite"}</h3>${q.explanation ? `<p>${esc(q.explanation)}</p>` : ""}</div>`;
  const nb = document.getElementById("next"); nb.hidden = false; nb.focus();
  if (!OFFLINE) api("/api/attempt", { slug: S.quiz.slug, qid: q.id, choice: k }).catch(() => {});
}

async function answerOpen(q) {
  const ta = document.getElementById("ans"), gb = document.getElementById("grade"), fb = document.getElementById("fb");
  const answer = ta.value.trim();
  if (!answer || gb.disabled) return;
  if (OFFLINE) return selfCheck(q);
  gb.disabled = true; ta.readOnly = true; document.getElementById("skip").hidden = true;
  const t0 = Date.now();
  fb.innerHTML = `<div class="feedback"><span class="spinner"></span> <span id="tick">Claude is grading your answer… 0s</span></div>`;
  const timer = setInterval(() => { const el = document.getElementById("tick"); if (el) el.textContent = `Claude is grading your answer… ${Math.round((Date.now() - t0) / 1000)}s`; }, 500);
  try {
    const g = await api("/api/grade", { slug: S.quiz.slug, qid: q.id, answer });
    clearInterval(timer);
    const status = g.verdict === "correct" ? "ok" : g.verdict === "partial" ? "partial" : "bad";
    S.results[q.id] = { status, score: g.score };
    const pts = [...(g.points_hit || []).map(p => `<li class="hit" data-i="✓">${esc(p)}</li>`),
                 ...(g.points_missed || []).map(p => `<li class="miss" data-i="✗">${esc(p)}</li>`)].join("");
    fb.innerHTML = `<div class="feedback ${status}">
      <h3><span class="score">${g.score}</span><span>${esc(g.verdict)}</span></h3>
      ${pts ? `<ul class="points">${pts}</ul>` : ""}
      <p>${esc(g.feedback)}</p>
      ${g.review_hint ? `<p class="small"><b>Review:</b> ${esc(g.review_hint)}</p>` : ""}
      ${q.reference_answer ? `<details><summary>Reference answer</summary><p>${esc(q.reference_answer)}</p></details>` : ""}
      ${g._meta ? `<p class="small muted">Graded in ${Math.round((g._meta.duration_ms || 0) / 1000)}s · ${esc(g._meta.model)}</p>` : ""}
    </div>`;
    gb.hidden = true;
    document.getElementById("hint").hidden = true;
    const nb = document.getElementById("next"); nb.hidden = false; nb.focus();
  } catch (e) {
    clearInterval(timer);
    fb.innerHTML = `<div class="feedback bad"><h3>Grading failed</h3><p>${esc(e.message)}</p></div>`;
    gb.disabled = false; ta.readOnly = false; document.getElementById("skip").hidden = false;
  }
}

// Offline: show the reference answer and let the student tick the key points they covered.
function selfCheck(q) {
  const ta = document.getElementById("ans"), gb = document.getElementById("grade"), fb = document.getElementById("fb");
  gb.hidden = true; ta.readOnly = true; document.getElementById("skip").hidden = true; document.getElementById("hint").hidden = true;
  const kps = q.key_points || [];
  fb.innerHTML = `<div class="feedback">
    <h3>Self-check</h3>
    <p class="small muted">Tick each key point your answer covers.</p>
    <div class="checks">${kps.map((k, i) => `<label><input type="checkbox" data-i="${i}"> ${esc(k)}</label>`).join("")}</div>
    ${q.reference_answer ? `<details open><summary>Reference answer</summary><p>${esc(q.reference_answer)}</p></details>` : ""}
    <p class="small muted">For Claude grading, open <code>${SERVER_URL}/quiz/${esc(S.quiz.slug)}</code> with the server running.</p>
  </div>`;
  const nb = document.getElementById("next"); nb.hidden = false;
  nb.addEventListener("click", () => {
    const hit = fb.querySelectorAll("input:checked").length;
    const score = kps.length ? Math.round((hit / kps.length) * 100) : 0;
    S.results[q.id] = { status: score >= 80 ? "ok" : score >= 40 ? "partial" : "bad", score };
  }, { capture: true, once: true });
}

function renderSummary() {
  const rs = S.order.map(q => ({ q, r: S.results[q.id] || { status: "skip" } }));
  const count = s => rs.filter(x => x.r.status === s).length;
  const missed = rs.filter(x => x.r.status !== "ok").map(x => x.q);
  const label = { ok: "correct", partial: "partial", bad: "wrong", skip: "skipped" };
  shell(`<section class="card">
    <h2>Done</h2>
    <div class="stats">
      <div class="stat"><b>${count("ok")}</b><span class="small muted">correct</span></div>
      <div class="stat"><b>${count("partial")}</b><span class="small muted">partial</span></div>
      <div class="stat"><b>${count("bad") + count("skip")}</b><span class="small muted">wrong / skipped</span></div>
    </div>
    <div class="review">${rs.map(({ q, r }) => `<div class="item"><span class="dot ${r.status}"></span>
      <span>${esc(q.prompt)}</span><span class="spacer"></span><span class="muted">${r.score != null ? r.score : label[r.status]}</span></div>`).join("")}</div>
    <div class="row"><span class="spacer"></span>
      <button class="btn" id="again">Restart all</button>
      ${missed.length ? `<button class="btn primary" id="retry">Retry ${missed.length} missed</button>` : ""}
    </div>
    <p class="small muted">${OFFLINE
      ? `Offline copy. For Claude grading and saved progress, run the study-quiz server and open <code>${SERVER_URL}/quiz/${esc(S.quiz.slug)}</code>.`
      : `To study weak spots, ask Claude Code: <code>/study-quiz:quiz from mistakes ${esc(S.quiz.slug)}</code>`}</p>
  </section>`);
  document.getElementById("again").addEventListener("click", () => start(S.quiz.questions));
  const rb = document.getElementById("retry"); if (rb) rb.addEventListener("click", () => start(missed));
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  const q = S.order[S.i];
  if (q && q.type === "mc" && !S.results[q.id] && /^[1-8]$/.test(e.key) && +e.key <= q.options.length) answerMC(q, +e.key - 1);
});

if (EMBEDDED) { S.quiz = EMBEDDED; document.title = `${S.quiz.title} · Study Quiz`; start(S.quiz.questions); }
else {
  const m = location.pathname.match(/^\/quiz\/([^/]+)\/?$/);
  m ? renderQuizPage(decodeURIComponent(m[1])) : renderIndex();
}
</script>
</body>
</html>
